<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Картотека · Parfumerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --cream: #f4ecd8;
    --cream-deep: #ebe0c4;
    --paper: #faf6ea;
    --ink: #1a1a1a;
    --ink-soft: #2c2c2c;
    --sepia: #6b5a3e;
    --sepia-light: #8a7858;
    --forest: #2d4a36;
    --forest-deep: #1f3527;
    --rust: #8b3a1f;
    --gold: #a07e3b;
    --line: #c9b88f;
    --line-soft: #d9cba6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: var(--cream);
    background-image:
      radial-gradient(ellipse at top left, rgba(160, 126, 59, 0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(45, 74, 54, 0.06), transparent 50%);
    color: var(--ink);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.5;
    padding: 0;
  }

  /* Paper texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(107, 90, 62, 0.015) 2px, rgba(107, 90, 62, 0.015) 3px),
      repeating-linear-gradient(90deg, transparent 0, transparent 2px, rgba(107, 90, 62, 0.012) 2px, rgba(107, 90, 62, 0.012) 3px);
    pointer-events: none;
    z-index: 1;
  }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
    position: relative;
    z-index: 2;
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--forest-deep);
    color: var(--cream);
    padding: 48px 24px;
    position: sticky;
    top: 0;
    height: 100vh;
    border-right: 1px solid var(--forest);
    display: flex;
    flex-direction: column;
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 28px;
    line-height: 1.1;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 48px;
    opacity: 0.8;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-btn {
    background: transparent;
    border: none;
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    text-align: left;
    padding: 12px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    letter-spacing: 0.3px;
  }

  .nav-btn:hover {
    background: rgba(244, 236, 216, 0.05);
    border-left-color: var(--gold);
  }

  .nav-btn.active {
    background: rgba(244, 236, 216, 0.08);
    border-left-color: var(--gold);
    font-style: italic;
  }

  .nav-btn .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    opacity: 0.7;
    min-width: 24px;
  }

  .sidebar-foot {
    margin-top: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--sepia-light);
    text-transform: uppercase;
    opacity: 0.5;
    border-top: 1px solid rgba(244, 236, 216, 0.1);
    padding-top: 24px;
  }

  /* MAIN */
  .main {
    padding: 48px 56px 80px;
    overflow-x: auto;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
    margin-bottom: 32px;
    gap: 24px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 48px;
    line-height: 1;
    letter-spacing: -0.5px;
    color: var(--ink);
  }

  .header-left h1 em {
    font-style: italic;
    color: var(--forest);
  }

  .header-left .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--sepia);
    text-transform: uppercase;
    margin-top: 8px;
  }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 10px 16px;
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    color: var(--ink);
    width: 240px;
    font-style: italic;
    transition: border-color 0.2s;
  }
  .search:focus {
    outline: none;
    border-color: var(--forest);
  }
  .search::placeholder { color: var(--sepia-light); }

  .btn {
    background: var(--forest);
    color: var(--cream);
    border: none;
    padding: 11px 22px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--forest-deep); }

  .btn-ghost {
    background: transparent;
    color: var(--forest);
    border: 1px solid var(--forest);
  }
  .btn-ghost:hover { background: var(--forest); color: var(--cream); }

  .btn-small {
    padding: 6px 14px;
    font-size: 14px;
  }

  /* TABLE */
  .table-wrap {
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 2px 0 var(--line-soft), 0 8px 24px rgba(107, 90, 62, 0.08);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }

  thead th {
    background: var(--cream-deep);
    text-align: left;
    padding: 14px 18px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--sepia);
    border-bottom: 2px solid var(--line);
  }

  tbody td {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: top;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(244, 236, 216, 0.5); }

  .letter-row td {
    background: var(--forest);
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    padding: 8px 18px;
    letter-spacing: 4px;
  }

  .ingr-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--ink);
  }

  .ingr-desc {
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 380px;
    line-height: 1.45;
  }

  .ingr-mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--sepia);
  }

  .tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid currentColor;
  }
  .tag.top { color: var(--rust); }
  .tag.middle { color: var(--gold); }
  .tag.base { color: var(--forest); }
  .tag.spine { color: var(--sepia); }
  .tag.middle-base { color: #6b7a3e; }
  .tag.top-middle { color: #b8642e; }
  .tag.middle-spine { color: #7a6a3e; }

  .row-actions {
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  tbody tr:hover .row-actions { opacity: 1; }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--sepia);
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--forest); color: var(--cream); border-color: var(--forest); }
  .icon-btn.danger:hover { background: var(--rust); border-color: var(--rust); }

  .empty {
    padding: 80px 24px;
    text-align: center;
    color: var(--sepia);
    font-style: italic;
    font-size: 18px;
  }

  /* FORMULAS */
  .formula-card {
    background: var(--paper);
    border: 1px solid var(--line);
    margin-bottom: 16px;
    box-shadow: 0 2px 0 var(--line-soft);
    transition: box-shadow 0.2s;
  }
  .formula-card:hover {
    box-shadow: 0 2px 0 var(--line-soft), 0 6px 20px rgba(107, 90, 62, 0.1);
  }

  .formula-head {
    padding: 20px 28px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .formula-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 500;
    color: var(--ink);
    flex: 1;
  }
  .formula-title em {
    color: var(--forest);
    font-style: italic;
  }

  .formula-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--sepia);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .chevron {
    color: var(--sepia);
    font-size: 18px;
    transition: transform 0.25s;
    font-family: 'Cormorant Garamond', serif;
  }
  .formula-card.open .chevron { transform: rotate(90deg); }

  .formula-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .formula-card.open .formula-body { max-height: 2000px; }

  .formula-inner {
    border-top: 1px solid var(--line-soft);
    padding: 24px 28px 28px;
    background: linear-gradient(180deg, rgba(244, 236, 216, 0.4), transparent);
  }

  .formula-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
  }
  .formula-table th {
    text-align: left;
    padding: 8px 12px;
    background: var(--cream-deep);
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--sepia);
    border-bottom: 1px solid var(--line);
  }
  .formula-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 15px;
  }
  .formula-table td:first-child { font-family: 'Cormorant Garamond', serif; font-size: 17px; }
  .formula-table td.num { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--sepia); }
  .formula-table tfoot td {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--forest);
    background: var(--cream);
    font-weight: 600;
  }

  .formula-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    border-top: 1px dashed var(--line-soft);
    padding-top: 16px;
  }

  /* MODAL */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(31, 53, 39, 0.45);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal-bg.show { display: flex; }

  .modal {
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 40px;
  }

  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 32px;
    margin-bottom: 4px;
  }
  .modal h2 em { color: var(--forest); font-style: italic; }

  .modal-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--sepia);
    margin-bottom: 28px;
  }

  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--sepia);
    margin-bottom: 6px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    background: var(--cream);
    font-family: 'EB Garamond', serif;
    font-size: 16px;
    color: var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none;
    border-color: var(--forest);
  }
  .field textarea {
    min-height: 80px;
    resize: vertical;
    font-family: 'EB Garamond', serif;
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 28px;
    border-top: 1px solid var(--line-soft);
    padding-top: 20px;
  }

  /* Formula ingredient rows in modal */
  .formula-ingr-row {
    display: grid;
    grid-template-columns: 1fr 90px 90px 32px;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .formula-ingr-row input, .formula-ingr-row select {
    padding: 8px 10px;
    font-size: 14px;
  }
  .add-row-btn {
    background: transparent;
    border: 1px dashed var(--forest);
    color: var(--forest);
    padding: 8px;
    width: 100%;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    margin-top: 6px;
  }
  .add-row-btn:hover { background: var(--forest); color: var(--cream); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--cream); }
  ::-webkit-scrollbar-thumb { background: var(--line); }
  ::-webkit-scrollbar-thumb:hover { background: var(--sepia-light); }

  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; padding: 24px; }
    .sidebar-foot { display: none; }
    .nav { flex-direction: row; }
    .main { padding: 28px 20px 60px; }
    .header-left h1 { font-size: 36px; }
    /* On mobile, hide the per-row inline actions; tap row to open action sheet */
    table th:last-child, table td:last-child { display: none; }
    tbody tr:not(.letter-row) { cursor: pointer; }
    tbody tr:not(.letter-row):active { background: rgba(244, 236, 216, 0.7); }
  }

  /* ACTION SHEET (mobile) */
  .sheet-bg {
    position: fixed;
    inset: 0;
    background: rgba(31, 53, 39, 0.45);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 90;
    animation: sheetFadeIn 0.18s ease;
  }
  .sheet-bg.show { display: flex; }
  @keyframes sheetFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .sheet {
    background: var(--paper);
    width: 100%;
    max-width: 520px;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.18);
    animation: sheetSlide 0.22s ease;
  }
  @keyframes sheetSlide {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .sheet-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
    padding: 4px 4px 12px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 4px;
  }
  .sheet .btn {
    width: 100%;
    padding: 14px 18px;
    font-size: 17px;
    text-align: center;
  }
  .sheet .btn-del {
    background: transparent;
    color: var(--rust);
    border: 1px solid var(--rust);
  }
  .sheet .btn-del:hover { background: var(--rust); color: var(--cream); }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">Parfumerie<br><span style="font-size:18px;">Cartothèque</span></div>
    <div class="brand-sub">Est. MMXXVI</div>

    <nav class="nav">
      <button class="nav-btn active" data-view="ingredients">
        <span class="num">I.</span> Ingredients
      </button>
      <button class="nav-btn" data-view="formulas">
        <span class="num">II.</span> Formula
      </button>
    </nav>

    <div class="sidebar-foot">Olfactory Index<br>Volume I</div>
  </aside>

  <main class="main">

    <!-- INGREDIENTS VIEW -->
    <section id="view-ingredients">
      <div class="header">
        <div class="header-left">
          <h1><em>Ingredient</em> Catalogue</h1>
          <div class="meta" id="ingr-count">— entries</div>
        </div>
        <div class="controls">
          <input type="text" class="search" id="ingr-search" placeholder="search the catalogue…">
          <button class="btn btn-ghost" id="export-btn" title="Export catalogue to Excel">↓ Export</button>
          <button class="btn" id="add-ingr-btn">+ Add</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 20%;">Ingredient</th>
              <th style="width: 32%;">Description</th>
              <th style="width: 14%;">Working Solution</th>
              <th style="width: 14%;">CAS №</th>
              <th style="width: 12%;">Note</th>
              <th style="width: 8%;"></th>
            </tr>
          </thead>
          <tbody id="ingr-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- FORMULAS VIEW -->
    <section id="view-formulas" style="display:none;">
      <div class="header">
        <div class="header-left">
          <h1>Book of <em>Formulae</em></h1>
          <div class="meta" id="form-count">— compositions</div>
        </div>
        <div class="controls">
          <input type="text" class="search" id="form-search" placeholder="search formula…">
          <button class="btn btn-ghost" id="export-btn-form" title="Export catalogue to Excel">↓ Export</button>
          <button class="btn" id="add-form-btn">+ New Formula</button>
        </div>
      </div>

      <div id="formulas-list"></div>
    </section>

  </main>
</div>

<!-- ROW ACTION SHEET (mobile) -->
<div class="sheet-bg" id="row-sheet-bg">
  <div class="sheet">
    <div class="sheet-title" id="row-sheet-title">—</div>
    <button class="btn" id="row-sheet-edit">✎ Edit</button>
    <button class="btn btn-del" id="row-sheet-del">× Delete</button>
    <button class="btn btn-ghost" id="row-sheet-cancel">Cancel</button>
  </div>
</div>

<!-- INGREDIENT MODAL -->
<div class="modal-bg" id="ingr-modal">
  <div class="modal">
    <h2 id="ingr-modal-title">New <em>Ingredient</em></h2>
    <div class="modal-sub">Entry in the catalogue</div>

    <div class="field">
      <label>Name</label>
      <input type="text" id="f-name" placeholder="e.g. Bergamot">
    </div>

    <div class="field">
      <label>Description</label>
      <textarea id="f-desc" placeholder="краткое описание ольфакторного профиля…"></textarea>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Working Solution</label>
        <input type="text" id="f-ws" placeholder="e.g. 10% DPG">
      </div>
      <div class="field">
        <label>CAS №</label>
        <input type="text" id="f-cas" placeholder="e.g. 8007-75-8">
      </div>
    </div>

    <div class="field">
      <label>Note</label>
      <select id="f-note">
        <option value="Top">Top</option>
        <option value="Middle">Middle</option>
        <option value="Base">Base</option>
        <option value="Spine">Spine</option>
        <option value="Middle/Base">Middle/Base</option>
        <option value="Top/Middle">Top/Middle</option>
        <option value="Middle/Spine">Middle/Spine</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="ingr-cancel">Cancel</button>
      <button class="btn" id="ingr-save">Save</button>
    </div>
  </div>
</div>

<!-- FORMULA MODAL -->
<div class="modal-bg" id="form-modal">
  <div class="modal">
    <h2 id="form-modal-title">New <em>Formula</em></h2>
    <div class="modal-sub">Perfume composition</div>

    <div class="field">
      <label>Formula name</label>
      <input type="text" id="ff-name" placeholder="e.g. Essence №1">
    </div>

    <div class="field">
      <label>Note (optional)</label>
      <input type="text" id="ff-note" placeholder="e.g. Citrus accord for summer">
    </div>

    <div class="field">
      <label>Composition</label>
      <div id="ff-rows"></div>
      <button class="add-row-btn" id="ff-add-row">+ Add component</button>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="form-cancel">Cancel</button>
      <button class="btn" id="form-save">Save</button>
    </div>
  </div>
</div>

<script>
/* ============ STATE ============ */
const LS_INGR = 'parfum_ingredients_v1';
const LS_FORM = 'parfum_formulas_v1';

let ingredients = JSON.parse(localStorage.getItem(LS_INGR) || '[]');
let formulas = JSON.parse(localStorage.getItem(LS_FORM) || '[]');

let editingIngrId = null;
let editingFormId = null;

/* ============ SEED EXAMPLES (only first load) ============ */
if (ingredients.length === 0 && formulas.length === 0) {
  ingredients = [
    { id: uid(), name: 'Cedarwood Virginian Oil', desc: 'Синтетический, травяной, земля-дерево, табачный, горьковато-сухо, бордовый, тёмно-зелёный, прохладный', ws: '', cas: '8000-27-9 / 85085-41-2', note: 'Base' },
    { id: uid(), name: 'Hedione', desc: 'Свежо, сложно описать, слегка белые цветы, озон, молочность, кисловатый, белый, прохладный', ws: '10%', cas: '24851-98-7', note: 'Middle' },
    { id: uid(), name: 'Triplal', desc: 'Ацетон, растворительно-цветочный, абсолютно химический, зелёный, свежий, тёплый', ws: '1%', cas: '68039-49-6', note: 'Top' }
  ];
  formulas = [];
  saveAll();
}

function uid() { return Math.random().toString(36).slice(2, 10); }
function saveAll() {
  localStorage.setItem(LS_INGR, JSON.stringify(ingredients));
  localStorage.setItem(LS_FORM, JSON.stringify(formulas));
}

/* ============ ONE-OFF MIGRATIONS ============ */
const LS_MIGRATIONS = 'parfum_migrations_applied';
const appliedMigrations = JSON.parse(localStorage.getItem(LS_MIGRATIONS) || '[]');

const migrations = [
  {
    id: '2026-05-23-remove-initial-seed',
    apply() {
      const seedNames = ['bergamot', 'vetiver', 'jasmine sambac', 'sandalwood'];
      ingredients = ingredients.filter(i =>
        !seedNames.includes((i.name || '').toLowerCase().trim())
      );
      formulas = formulas.filter(f =>
        (f.name || '').toLowerCase().trim() !== 'essence №1'
      );
    }
  },
  {
    id: '2026-05-23-add-12-14',
    apply() {
      const adds = [
        { name: 'Cedarwood Virginian Oil', desc: 'Синтетический, травяной, земля-дерево, табачный, горьковато-сухо, бордовый, тёмно-зелёный, прохладный', ws: '', cas: '8000-27-9 / 85085-41-2', note: 'Base' },
        { name: 'Hedione', desc: 'Свежо, сложно описать, слегка белые цветы, озон, молочность, кисловатый, белый, прохладный', ws: '10%', cas: '24851-98-7', note: 'Middle' },
        { name: 'Triplal', desc: 'Ацетон, растворительно-цветочный, абсолютно химический, зелёный, свежий, тёплый', ws: '1%', cas: '68039-49-6', note: 'Top' }
      ];
      adds.forEach(a => {
        if (!ingredients.find(i => (i.name || '').toLowerCase() === a.name.toLowerCase())) {
          ingredients.push({ id: uid(), ...a });
        }
      });
    }
  },
  {
    id: '2026-05-23-add-1-11',
    apply() {
      const adds = [
        { name: 'Bergamot', desc: 'Чай, лаванда, специи, цитрус, свежо, шероховато', ws: '10%', cas: '89957-91-5 / 8007-75-8 / 68648-33-9 / 71949-33-2', note: 'Top' },
        { name: 'Linalyl Acetate', desc: 'Чай, бергамот, специи, лаванда, звенящий, горький, зелёный, яркий, холодный', ws: '', cas: '115-95-7', note: 'Top' },
        { name: 'Lavender', desc: 'Специи, мягкие, возможно гвоздично, остро, парфюмерно, лаванда, сырая земля, камфорность, цветочный, травяной, бодро, горячо', ws: '10%', cas: '8000-28-0', note: 'Middle' },
        { name: 'Linalool', desc: 'Лаванда, но более цветочная, индольная, бергамот, тёплая, сухая, розово-сиреневая', ws: '10%', cas: '', note: 'Middle/Spine' },
        { name: 'Calone', desc: 'Море, мокрые камни с водорослями, металл, немного арбуз, неприятный овощ, прохладный, прозрачно-голубой', ws: '10% / 1%', cas: '28940-11-6', note: 'Spine' },
        { name: 'Ambroxan', desc: 'Мягкий ветер, озоновые частоты, мужской. Раскрывается позже и сильно, сухой и прозрачный', ws: '10% / 1%', cas: '6790-58-5', note: 'Base' },
        { name: 'Iso E Super / Iso Myrcetone', desc: 'Сексуально, чувственно, мускус, чистое тело, спил дерева, пудрово-древесная нота, белая, бежевая', ws: '10%', cas: '54464-57-2', note: 'Base' },
        { name: 'Anethole', desc: 'Анис, мерзко, тошнотворно, трава, лекарство, мокро, бордо, зелёно-красный', ws: '1%', cas: '104-46-1 / 4180-23-8', note: 'Top' },
        { name: 'Vetiver Haiti Oil', desc: 'Остро, специи, травы, земля, деревяшка, шоколад, табачность, ментоловый, камфорный, шоколад, остро, тёпло-фиолетовый, коричневый', ws: '', cas: '', note: 'Base' },
        { name: 'Lemon Oil', desc: 'Цитрус, ярко, звонко, сочно, лайм, супер кисло, терпко, жёлтый', ws: '10%', cas: '8008-56-8 / 84929-31-7', note: 'Top' },
        { name: 'Hydroxycitronellal', desc: 'Цветочно, мягко, пудрово, белоцветочно, ландыш, свежий', ws: '10%', cas: '', note: 'Middle/Base' }
      ];
      adds.forEach(a => {
        if (!ingredients.find(i => (i.name || '').toLowerCase() === a.name.toLowerCase())) {
          ingredients.push({ id: uid(), ...a });
        }
      });
    }
  }
];

let migrationRan = false;
migrations.forEach(m => {
  if (!appliedMigrations.includes(m.id)) {
    m.apply();
    appliedMigrations.push(m.id);
    migrationRan = true;
  }
});
if (migrationRan) {
  localStorage.setItem(LS_MIGRATIONS, JSON.stringify(appliedMigrations));
  saveAll();
}

/* ============ NAV ============ */
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    document.getElementById('view-ingredients').style.display = view === 'ingredients' ? '' : 'none';
    document.getElementById('view-formulas').style.display = view === 'formulas' ? '' : 'none';
  });
});

/* ============ INGREDIENTS RENDER ============ */
const TRANSLIT_MAP = {
  'А':'A','Б':'B','В':'V','Г':'G','Д':'D','Е':'E','Ё':'E','Ж':'ZH','З':'Z',
  'И':'I','Й':'Y','К':'K','Л':'L','М':'M','Н':'N','О':'O','П':'P','Р':'R',
  'С':'S','Т':'T','У':'U','Ф':'F','Х':'KH','Ц':'TS','Ч':'CH','Ш':'SH',
  'Щ':'SCH','Ъ':'','Ы':'Y','Ь':'','Э':'E','Ю':'YU','Я':'YA'
};

function translitLetter(name) {
  const ch = (name || '').trim().charAt(0).toUpperCase();
  if (!ch) return '';
  return TRANSLIT_MAP[ch] !== undefined ? TRANSLIT_MAP[ch] : ch;
}

function sortIngredients() {
  ingredients.sort((a, b) => {
    const la = translitLetter(a.name);
    const lb = translitLetter(b.name);
    if (la !== lb) return la.localeCompare(lb, 'en');
    return a.name.localeCompare(b.name, 'ru', { sensitivity: 'base' });
  });
}

function renderIngredients() {
  sortIngredients();
  const q = document.getElementById('ingr-search').value.trim().toLowerCase();
  const filtered = q
    ? ingredients.filter(i =>
        i.name.toLowerCase().includes(q) ||
        (i.desc || '').toLowerCase().includes(q) ||
        (i.cas || '').toLowerCase().includes(q))
    : ingredients;

  const tbody = document.getElementById('ingr-tbody');
  tbody.innerHTML = '';

  document.getElementById('ingr-count').textContent =
    `${ingredients.length} ${ingredients.length === 1 ? 'entry' : 'entries'}`;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">The catalogue is empty. Add your first ingredient.</td></tr>`;
    return;
  }

  let currentLetter = '';
  filtered.forEach(item => {
    const letter = translitLetter(item.name);
    if (letter !== currentLetter) {
      currentLetter = letter;
      const lr = document.createElement('tr');
      lr.className = 'letter-row';
      lr.innerHTML = `<td colspan="6">${letter}</td>`;
      tbody.appendChild(lr);
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="ingr-name">${escapeHtml(item.name)}</td>
      <td class="ingr-desc">${escapeHtml(item.desc || '')}</td>
      <td class="ingr-mono">${escapeHtml(item.ws || '—')}</td>
      <td class="ingr-mono">${escapeHtml(item.cas || '—')}</td>
      <td><span class="tag ${(item.note || '').toLowerCase().replace(/\//g, '-')}">${escapeHtml(item.note || '—')}</span></td>
      <td>
        <div class="row-actions">
          <button class="icon-btn" title="Edit" data-edit="${item.id}">✎</button>
          <button class="icon-btn danger" title="Delete" data-del="${item.id}">×</button>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    openIngrModal(b.dataset.edit);
  }));
  tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    if (confirm('Delete this entry?')) {
      ingredients = ingredients.filter(x => x.id !== b.dataset.del);
      saveAll();
      renderIngredients();
    }
  }));

  // Mobile: tap row to open action sheet
  tbody.querySelectorAll('tr:not(.letter-row)').forEach(tr => {
    const editBtn = tr.querySelector('[data-edit]');
    if (!editBtn) return;
    const id = editBtn.dataset.edit;
    tr.addEventListener('click', e => {
      if (!isMobileView()) return;
      if (e.target.closest('button')) return;
      openRowSheet(id);
    });
  });
}

/* ============ MOBILE ROW ACTION SHEET ============ */
function isMobileView() {
  return window.matchMedia('(max-width: 880px)').matches;
}

let activeRowIngrId = null;
const rowSheetBg = document.getElementById('row-sheet-bg');
const rowSheetTitle = document.getElementById('row-sheet-title');

function openRowSheet(id) {
  const it = ingredients.find(x => x.id === id);
  if (!it) return;
  activeRowIngrId = id;
  rowSheetTitle.textContent = it.name || '—';
  rowSheetBg.classList.add('show');
}
function closeRowSheet() {
  rowSheetBg.classList.remove('show');
  activeRowIngrId = null;
}

document.getElementById('row-sheet-edit').addEventListener('click', () => {
  const id = activeRowIngrId;
  closeRowSheet();
  if (id) openIngrModal(id);
});
document.getElementById('row-sheet-del').addEventListener('click', () => {
  const id = activeRowIngrId;
  closeRowSheet();
  if (id && confirm('Delete this entry?')) {
    ingredients = ingredients.filter(x => x.id !== id);
    saveAll();
    renderIngredients();
  }
});
document.getElementById('row-sheet-cancel').addEventListener('click', closeRowSheet);
rowSheetBg.addEventListener('click', e => {
  if (e.target === rowSheetBg) closeRowSheet();
});

function declOf(n, forms) {
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b > 1 && b < 5) return forms[1];
  if (b === 1) return forms[0];
  return forms[2];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ INGREDIENT MODAL ============ */
const ingrModal = document.getElementById('ingr-modal');

function openIngrModal(id = null) {
  editingIngrId = id;
  const titleEl = document.getElementById('ingr-modal-title');
  if (id) {
    const it = ingredients.find(x => x.id === id);
    titleEl.innerHTML = 'Edit <em>Ingredient</em>';
    document.getElementById('f-name').value = it.name;
    document.getElementById('f-desc').value = it.desc || '';
    document.getElementById('f-ws').value = it.ws || '';
    document.getElementById('f-cas').value = it.cas || '';
    document.getElementById('f-note').value = it.note || 'Top';
  } else {
    titleEl.innerHTML = 'New <em>Ingredient</em>';
    ['f-name','f-desc','f-ws','f-cas'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('f-note').value = 'Top';
  }
  ingrModal.classList.add('show');
  setTimeout(() => document.getElementById('f-name').focus(), 50);
}

document.getElementById('add-ingr-btn').addEventListener('click', () => openIngrModal());
document.getElementById('ingr-cancel').addEventListener('click', () => ingrModal.classList.remove('show'));
ingrModal.addEventListener('click', e => { if (e.target === ingrModal) ingrModal.classList.remove('show'); });

document.getElementById('ingr-save').addEventListener('click', () => {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Please enter a name'); return; }
  const data = {
    name,
    desc: document.getElementById('f-desc').value.trim(),
    ws: document.getElementById('f-ws').value.trim(),
    cas: document.getElementById('f-cas').value.trim(),
    note: document.getElementById('f-note').value
  };
  if (editingIngrId) {
    const idx = ingredients.findIndex(x => x.id === editingIngrId);
    ingredients[idx] = { ...ingredients[idx], ...data };
  } else {
    ingredients.push({ id: uid(), ...data });
  }
  saveAll();
  renderIngredients();
  ingrModal.classList.remove('show');
});

document.getElementById('ingr-search').addEventListener('input', renderIngredients);

/* ============ FORMULAS RENDER ============ */
function renderFormulas() {
  const q = document.getElementById('form-search').value.trim().toLowerCase();
  const filtered = q ? formulas.filter(f => f.name.toLowerCase().includes(q)) : formulas;
  const list = document.getElementById('formulas-list');
  list.innerHTML = '';

  document.getElementById('form-count').textContent =
    `${formulas.length} ${formulas.length === 1 ? 'composition' : 'compositions'}`;

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty" style="background:var(--paper);border:1px solid var(--line);">Your formulae will appear here. Create the first one.</div>`;
    return;
  }

  filtered.forEach(f => {
    const totalPercent = (f.rows || []).reduce((s, r) => s + (parseFloat(r.percent) || 0), 0);
    const totalAmount = (f.rows || []).reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
    const card = document.createElement('div');
    card.className = 'formula-card';
    card.innerHTML = `
      <div class="formula-head">
        <div>
          <div class="formula-title"><em>№</em> ${escapeHtml(f.name)}</div>
          <div class="formula-meta">${(f.rows||[]).length} components${f.note ? ' · ' + escapeHtml(f.note) : ''}</div>
        </div>
        <div class="chevron">›</div>
      </div>
      <div class="formula-body">
        <div class="formula-inner">
          <table class="formula-table">
            <thead>
              <tr><th>Ingredient</th><th>Input %</th><th>Quantity</th></tr>
            </thead>
            <tbody>
              ${(f.rows||[]).map(r => `
                <tr>
                  <td>${escapeHtml(r.name)}</td>
                  <td class="num">${escapeHtml(String(r.percent))}%</td>
                  <td class="num">${escapeHtml(String(r.amount))}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot>
              <tr><td>Total</td><td class="num">${totalPercent.toFixed(2)}%</td><td class="num">${totalAmount.toFixed(3)}</td></tr>
            </tfoot>
          </table>
          <div class="formula-actions">
            <button class="btn btn-ghost btn-small" data-form-edit="${f.id}">Edit</button>
            <button class="btn btn-ghost btn-small" data-form-del="${f.id}" style="border-color:var(--rust); color:var(--rust);">Delete</button>
          </div>
        </div>
      </div>`;
    list.appendChild(card);

    card.querySelector('.formula-head').addEventListener('click', () => card.classList.toggle('open'));
  });

  list.querySelectorAll('[data-form-edit]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    openFormModal(b.dataset.formEdit);
  }));
  list.querySelectorAll('[data-form-del]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    if (confirm('Delete this formula?')) {
      formulas = formulas.filter(x => x.id !== b.dataset.formDel);
      saveAll();
      renderFormulas();
    }
  }));
}

/* ============ FORMULA MODAL ============ */
const formModal = document.getElementById('form-modal');
let formRowsDraft = [];

function renderFormRows() {
  const wrap = document.getElementById('ff-rows');
  wrap.innerHTML = '';
  formRowsDraft.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'formula-ingr-row';
    const datalistId = `dl-${i}`;
    row.innerHTML = `
      <input type="text" placeholder="ingredient" value="${escapeHtml(r.name || '')}" list="${datalistId}" data-i="${i}" data-k="name">
      <datalist id="${datalistId}">
        ${ingredients.map(ing => `<option value="${escapeHtml(ing.name)}">`).join('')}
      </datalist>
      <input type="number" step="0.01" placeholder="%" value="${r.percent ?? ''}" data-i="${i}" data-k="percent">
      <input type="number" step="0.001" placeholder="qty" value="${r.amount ?? ''}" data-i="${i}" data-k="amount">
      <button class="icon-btn danger" data-rm="${i}" title="Remove row">×</button>`;
    wrap.appendChild(row);
  });

  wrap.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = +e.target.dataset.i;
      const k = e.target.dataset.k;
      formRowsDraft[i][k] = k === 'name' ? e.target.value : (e.target.value === '' ? '' : parseFloat(e.target.value));
    });
  });
  wrap.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    formRowsDraft.splice(+b.dataset.rm, 1);
    renderFormRows();
  }));
}

function openFormModal(id = null) {
  editingFormId = id;
  const titleEl = document.getElementById('form-modal-title');
  if (id) {
    const f = formulas.find(x => x.id === id);
    titleEl.innerHTML = 'Edit <em>Formula</em>';
    document.getElementById('ff-name').value = f.name;
    document.getElementById('ff-note').value = f.note || '';
    formRowsDraft = JSON.parse(JSON.stringify(f.rows || []));
  } else {
    titleEl.innerHTML = 'New <em>Formula</em>';
    document.getElementById('ff-name').value = '';
    document.getElementById('ff-note').value = '';
    formRowsDraft = [{ name: '', percent: '', amount: '' }];
  }
  renderFormRows();
  formModal.classList.add('show');
  setTimeout(() => document.getElementById('ff-name').focus(), 50);
}

document.getElementById('add-form-btn').addEventListener('click', () => openFormModal());
document.getElementById('form-cancel').addEventListener('click', () => formModal.classList.remove('show'));
formModal.addEventListener('click', e => { if (e.target === formModal) formModal.classList.remove('show'); });

document.getElementById('ff-add-row').addEventListener('click', () => {
  formRowsDraft.push({ name: '', percent: '', amount: '' });
  renderFormRows();
});

document.getElementById('form-save').addEventListener('click', () => {
  const name = document.getElementById('ff-name').value.trim();
  if (!name) { alert('Please enter a formula name'); return; }
  const cleanRows = formRowsDraft.filter(r => (r.name || '').trim() !== '');
  const data = {
    name,
    note: document.getElementById('ff-note').value.trim(),
    rows: cleanRows
  };
  if (editingFormId) {
    const idx = formulas.findIndex(x => x.id === editingFormId);
    formulas[idx] = { ...formulas[idx], ...data };
  } else {
    formulas.push({ id: uid(), ...data });
  }
  saveAll();
  renderFormulas();
  formModal.classList.remove('show');
});

document.getElementById('form-search').addEventListener('input', renderFormulas);

/* ============ EXPORT ============ */
function exportToExcel() {
  if (typeof XLSX === 'undefined') {
    alert('Export library is still loading. Please try again in a moment.');
    return;
  }

  const wb = XLSX.utils.book_new();

  sortIngredients();
  const ingrRows = ingredients.map(i => ({
    'Name': i.name || '',
    'Description': i.desc || '',
    'Working Solution': i.ws || '',
    'CAS №': i.cas || '',
    'Note': i.note || ''
  }));
  const ingrSheet = XLSX.utils.json_to_sheet(ingrRows, {
    header: ['Name', 'Description', 'Working Solution', 'CAS №', 'Note']
  });
  ingrSheet['!cols'] = [{ wch: 24 }, { wch: 56 }, { wch: 18 }, { wch: 16 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ingrSheet, 'Ingredients');

  const formRows = [];
  formulas.forEach(f => {
    const rows = f.rows || [];
    const totalPercent = rows.reduce((s, r) => s + (parseFloat(r.percent) || 0), 0);
    const totalAmount = rows.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
    rows.forEach((r, idx) => {
      formRows.push({
        'Formula': idx === 0 ? f.name : '',
        'Note': idx === 0 ? (f.note || '') : '',
        'Ingredient': r.name || '',
        'Input %': r.percent === '' || r.percent == null ? '' : Number(r.percent),
        'Quantity': r.amount === '' || r.amount == null ? '' : Number(r.amount)
      });
    });
    if (rows.length === 0) {
      formRows.push({ 'Formula': f.name, 'Note': f.note || '', 'Ingredient': '', 'Input %': '', 'Quantity': '' });
    }
    formRows.push({
      'Formula': '', 'Note': '', 'Ingredient': 'TOTAL',
      'Input %': Number(totalPercent.toFixed(2)),
      'Quantity': Number(totalAmount.toFixed(3))
    });
    formRows.push({});
  });
  const formSheet = XLSX.utils.json_to_sheet(formRows, {
    header: ['Formula', 'Note', 'Ingredient', 'Input %', 'Quantity']
  });
  formSheet['!cols'] = [{ wch: 22 }, { wch: 26 }, { wch: 24 }, { wch: 10 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, formSheet, 'Formulas');

  const d = new Date();
  const stamp = d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
  const filename = `parfumerie_${stamp}.xlsx`;

  try {
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbout], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
    downloadBlob(blob, filename);
  } catch (err) {
    alert('Export failed: ' + (err && err.message ? err.message : err));
  }
}

document.getElementById('export-btn').addEventListener('click', exportToExcel);
document.getElementById('export-btn-form').addEventListener('click', exportToExcel);

function downloadBlob(blob, filename) {
  // IE / old Edge
  if (window.navigator && window.navigator.msSaveOrOpenBlob) {
    window.navigator.msSaveOrOpenBlob(blob, filename);
    return;
  }
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

  if (isIOS) {
    // iOS Safari ignores <a download> for blob: URLs.
    // Use a data URL so the file opens in the share/preview sheet,
    // from where the user can save to Files / iCloud / Mail.
    const reader = new FileReader();
    reader.onload = function () {
      const dataUrl = reader.result;
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        // Fallback: if nothing happened, navigate to the data URL
        // (works in iOS Safari preview).
      }, 150);
    };
    reader.onerror = function () {
      alert('Could not prepare the file. Try a desktop browser.');
    };
    reader.readAsDataURL(blob);
    return;
  }

  // Desktop + Android
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 200);
}
